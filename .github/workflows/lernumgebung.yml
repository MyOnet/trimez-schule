# Baut die trimez. Lernumgebung für Windows und macOS und legt die Installationsdateien als Artefakte ab.
# Geheimnisse (in GitHub unter Settings → Secrets eintragen, nie im Quelltext):
#   LU_SERVER            Adresse des Servers, z. B. https://schule.trimez.ch
#   LU_SCHLUESSEL        Schlüssel dieser Version (base64url, 32 Byte); derselbe Wert gehört in LERNUMGEBUNG_SCHLUESSEL des Servers
#   Code-Signatur für Windows folgt (ohne Signatur warnt Windows SmartScreen beim ersten Start)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   Signatur und Beglaubigung macOS
name: Lernumgebung
on:
  workflow_dispatch:
  push:
    tags: ["lernumgebung-v*"]
jobs:
  kern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p lernumgebung-kern
        working-directory: apps/lernumgebung
  bauen:
    needs: kern
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: x86_64-pc-windows-msvc
          - os: macos-latest
            ziel: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Symbole erzeugen
        run: npx --yes @tauri-apps/cli@2 icon icons/icon_1024.png
        working-directory: apps/lernumgebung/app
      - name: Bauen
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.ziel }}
        working-directory: apps/lernumgebung/app
        env:
          LU_SERVER: ${{ secrets.LU_SERVER }}
          LU_SCHLUESSEL: ${{ secrets.LU_SCHLUESSEL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: lernumgebung-${{ matrix.os }}
          path: |
            apps/lernumgebung/target/*/release/bundle/nsis/*.exe
            apps/lernumgebung/target/*/release/bundle/dmg/*.dmg
